[project]
name = "media-atlas-backend"
version = "0.1.0"
description = "Independent multimodal asset platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.35,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "redis>=5,<7",
  "celery[redis]>=5.4,<6",
  "tos==2.7.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
